name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # Fail rather than deploy a copy that asks visitors for their own Client ID.
      - run: test -n "$VITE_CLIENT_ID" || { echo "Set the SPOTIFY_CLIENT_ID repository variable"; exit 1; }
        env:
          VITE_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
      - run: npm run build
        env:
          VITE_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v5
